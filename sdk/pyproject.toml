[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secureagent"
version = "0.1.0"
description = "Enterprise security for AI agents — taint tracking, audit trails, PII detection, approval gates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "SecureAgent Team" },
]
keywords = ["ai", "agents", "security", "audit", "compliance", "taint-tracking", "pii"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
langchain = ["langchain-core>=0.1.0"]
crewai = ["crewai>=0.1.0"]
all = ["secureagent[pii,langchain,crewai]"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/secureagent/secureagent"
Documentation = "https://docs.secureagent.dev"

[tool.hatch.build.targets.wheel]
packages = ["secureagent"]
