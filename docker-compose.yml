services:
  # ─── Backend (FastAPI) ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    restart: unless-stopped

  # ─── Task Worker (arq) ───────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: arq workers.task_worker.WorkerSettings
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - agentOS-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    restart: unless-stopped

  # ─── Frontend (Next.js) ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    profiles:
      - with-frontend

  # ─── LiteLLM (LLM Router) ──────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:latest
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master}
      - DATABASE_URL=${DATABASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/config/litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    restart: unless-stopped

  # ─── PostgreSQL + pgvector ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentOS}
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=200
      -c shared_buffers=256MB
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M
    restart: unless-stopped

  # ─── Neo4j (Graph DB) ──────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-agentOS-neo4j-password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── Langfuse (Observability) ───────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/langfuse}
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: agentOS-langfuse-secret
      SALT: agentOS-langfuse-salt
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── LLM Guard (Security) ──────────────────────────────────────────
  llm-guard:
    build:
      context: .
      dockerfile: Dockerfile.llm-guard
    ports:
      - "8080:8080"
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── Letta (Memory Server) ─────────────────────────────────────────
  letta:
    image: ghcr.io/letta-ai/letta:latest
    ports:
      - "8283:8283"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8283/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── SuperTokens (Auth) ────────────────────────────────────────────
  supertokens:
    image: supertokens/supertokens-postgresql
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/agentOS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3567/hello"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ─── Hermes Agent (Nous Research v0.4.0) ───────────────────────────
  hermes:
    image: ghcr.io/nousresearch/hermes-agent:latest
    ports:
      - "3002:3000"
    env_file: .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    restart: unless-stopped
    profiles:
      - with-hermes

  # ─── DeerFlow 2.0 — LangGraph Server (Agent Runtime) ───────────────
  deerflow-langgraph:
    image: ghcr.io/bytedance/deer-flow:latest
    ports:
      - "2024:2024"
    env_file: .env
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master}
      - OPENAI_BASE_URL=http://litellm:4000/v1
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      - ./backend/config/deerflow_config.yaml:/app/config.yaml
      - deerflow-data:/app/.deer-flow
      - deerflow-workspace:/mnt/user-data
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2024/ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    restart: unless-stopped

  # ─── DeerFlow 2.0 — Gateway API (Skills, Memory, Files) ────────────
  deerflow-gateway:
    image: ghcr.io/bytedance/deer-flow-gateway:latest
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - LANGGRAPH_URL=http://deerflow-langgraph:2024
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    depends_on:
      deerflow-langgraph:
        condition: service_healthy
    volumes:
      - ./backend/config/deerflow_config.yaml:/app/config.yaml
      - deerflow-data:/app/.deer-flow
      - deerflow-workspace:/mnt/user-data
    networks:
      - agentOS-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  deerflow-data:
  deerflow-workspace:

networks:
  agentOS-network:
    driver: bridge
