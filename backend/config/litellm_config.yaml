# ═══════════════════════════════════════════════════════════════════════
# LiteLLM Model Configuration — AgentOS (Cost-First Routing)
# ═══════════════════════════════════════════════════════════════════════
#
# REQUIRED: ANTHROPIC_API_KEY + GOOGLE_API_KEY  (~$35/month)
# RECOMMENDED: QWEN_API_KEY + KIMI_API_KEY  (~$10/month)
#   → Enables cost-first routing: 60-70% token savings
#   → Without these keys, the model router falls back to Gemini/Sonnet
#
# ═══════════════════════════════════════════════════════════════════════

model_list:
  # ═══════════════════════════════════════════════════════════════════
  # TIER 1 — Orchestrator (planning & coordination)
  # Cost: ~$0.015/1K tokens — used sparingly for complex decisions
  # ═══════════════════════════════════════════════════════════════════
  - model_name: agentOS/orchestrator
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # ═══════════════════════════════════════════════════════════════════
  # TIER 2 — Workhorse (agent execution)
  # Claude Sonnet: $0.003/1K — complex tasks only
  # Gemini Flash: $0.0005/1K — complex documents, medium research
  # Qwen 3.5+: $0.0004/1K — medium code, docs, research (cost-first)
  # Kimi K2.5: $0.0004/1K — browser agent specialist (tool-calling)
  # ═══════════════════════════════════════════════════════════════════
  - model_name: agentOS/workhorse
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: agentOS/workhorse-gemini
    litellm_params:
      model: gemini/gemini-3-flash
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: agentOS/workhorse-qwen
    litellm_params:
      model: openai/qwen3.5-plus
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/QWEN_API_KEY

  - model_name: agentOS/workhorse-kimi
    litellm_params:
      model: openai/kimi-k2.5
      api_base: https://api.moonshot.ai/v1
      api_key: os.environ/KIMI_API_KEY

  # ═══════════════════════════════════════════════════════════════════
  # TIER 3 — Cheap (high-volume, low-cost tasks)
  # Gemini Lite: $0.0001/1K — fallback cheap tier
  # Qwen 3-8B: $0.00008/1K — primary cheap tier (cost-first)
  # ═══════════════════════════════════════════════════════════════════
  - model_name: agentOS/cheap
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: agentOS/cheap-qwen
    litellm_params:
      model: openai/qwen3-8b
      api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/QWEN_API_KEY

  # ═══════════════════════════════════════════════════════════════════
  # TIER 4 — Specialists
  # ═══════════════════════════════════════════════════════════════════

  # ── OPTIONAL: Uncomment for factual search via Perplexity Sonar ──
  # - model_name: agentOS/facts
  #   litellm_params:
  #     model: perplexity/sonar-pro
  #     api_key: os.environ/PERPLEXITY_API_KEY

  - model_name: agentOS/on-premise
    litellm_params:
      model: ollama/llama4
      api_base: os.environ/OLLAMA_API_BASE

  # ═══════════════════════════════════════════════════════════════════
  # Images
  # ═══════════════════════════════════════════════════════════════════
  - model_name: agentOS/images
    litellm_params:
      model: gemini/gemini-3.1-flash-image-preview
      api_key: os.environ/GOOGLE_API_KEY

# ═══════════════════════════════════════════════════════════════════════
# Routing & Fallbacks (cost-first cascading)
# ═══════════════════════════════════════════════════════════════════════
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 120
  fallbacks:
    - agentOS/workhorse: [agentOS/workhorse-gemini, agentOS/workhorse-qwen]
    - agentOS/workhorse-qwen: [agentOS/workhorse-gemini, agentOS/cheap-qwen]
    - agentOS/workhorse-kimi: [agentOS/workhorse-qwen, agentOS/workhorse-gemini]
    - agentOS/cheap: [agentOS/cheap-qwen]
    - agentOS/cheap-qwen: [agentOS/cheap]
    - agentOS/orchestrator: [agentOS/workhorse]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
